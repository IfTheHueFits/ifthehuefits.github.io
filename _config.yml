defaults:
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "post"
  - scope:
      path: ""
    values:
      layout: "default"

plugins:
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-seo-tag
  - jekyll-paginate
  - jekyll_picture_tag

excerpt_separator: <!--more-->
incremental: false

# Fail the build on a YAML front-matter syntax error, a Liquid syntax error,
# or a call to a filter that does not exist. Missing variables stay warnings.
strict_front_matter: true
liquid:
  error_mode: strict
  strict_filters: true

paginate: 10
paginate_path: "page:num/"

sass:
    style: compressed

include: [".nojekyll"]

url: https://ifthehuefits.github.io/

# Read by jekyll-seo-tag and jekyll-feed
title: If the Hue Fits
description: An assortment of miniature showcases, thoughts, tutorials and inspiration.
author:
  name: Ollie Jones
social:
  name: If the Hue Fits
  links:
    - https://www.facebook.com/ifthehuefitsblog
    - https://www.instagram.com/ifthehuefits.blog/
    - https://twitter.com/ifthehuefits

picture:
    source: "assets/images/_2kpx"
    output: "generated/images"
    suppress_warnings: true
