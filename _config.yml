collections:
  authors:
    output: true

defaults:
  - scope:
      path: ""
      type: "authors"
    values:
      layout: "authors"
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "post"
  - scope:
      path: ""
    values:
      layout: "default"

plugins:
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-seo-tag
  - jekyll-paginate
  - jekyll_picture_tag

excerpt_separator: <!--more-->
incremental: false

# Fail the build on a YAML front-matter syntax error, a Liquid syntax error,
# or a call to a filter that does not exist. Missing variables stay warnings.
strict_front_matter: true
liquid:
  error_mode: strict
  strict_filters: true

paginate: 10
paginate_path: "page:num/"

sass:
    style: compressed

include: [".nojekyll"]

url: https://ifthehuefits.github.io/

picture:
    source: "assets/images/_2kpx"
    output: "generated/images"
