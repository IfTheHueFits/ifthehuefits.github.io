{% assign img = include.img | image_path: page.path %}
{% if include.class %}
<figure class="{{include.class}}"{% if include.flex %} style="flex: {{include.flex}}"{% endif %}>
{% else %}
<figure>
{% endif %}
	{% picture {{include.preset}} {{img}} --alt {{include.alt}} --img style="{{include.style}}"%}
	{% if include.caption %}
	<figcaption>{{include.caption}}</figcaption>
	{% endif %}
</figure>
