# Build the Jekyll site on push to main and deploy to GitHub Pages.
# Post validator and html-proofer run inside `jekyll build`; deploy only if it passes.
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.2"
          bundler-cache: true

      - name: Install image tools
        run: sudo apt-get update && sudo apt-get install -y libvips-tools imagemagick

      # jekyll_picture_tag keeps `_site/generated` via keep_files and skips
      # existing resized files, so restoring this cache avoids re-encoding
      # every photo on each push.
      - name: Cache generated images
        uses: actions/cache@v6
        with:
          path: _site/generated
          key: jpt-${{ hashFiles('assets/images/_2kpx/**', '_data/picture.yml') }}
          restore-keys: |
            jpt-

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v6

      - name: Build with Jekyll
        run: bundle exec jekyll build --baseurl "${{ steps.pages.outputs.base_path }}"
        env:
          JEKYLL_ENV: production

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
